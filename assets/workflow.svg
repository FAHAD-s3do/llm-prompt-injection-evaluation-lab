<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img"><title>LLM Prompt-Injection Evaluation Lab</title><desc>Conceptual project workflow, not live telemetry.</desc><style>.packet{animation:travel 6s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite}.spin{transform-origin:230px 155px;animation:spin 10s linear infinite}@keyframes travel{0%{transform:translateX(0);opacity:.2}50%{opacity:1}100%{transform:translateX(270px);opacity:.2}}@keyframes pulse{50%{opacity:.2}}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.packet,.pulse,.spin{animation:none}}</style><rect width="1000" height="300" rx="18" fill="#080f1d"/><g font-family="monospace"><text x="28" y="40" fill="#7dd3fc" font-size="22">LLM PROMPT-INJECTION EVALUATION LAB</text><path d="M80 112H370M370 112V195H620M620 195V112H910" fill="none" stroke="#525087" stroke-width="3"/><text x="60" y="89" fill="#c4b5fd" font-size="17">TEST CASES</text><text x="280" y="245" fill="#7dd3fc" font-size="17">RECORDED OUTPUTS</text><text x="700" y="89" fill="#c4b5fd" font-size="17">EXACT-MARKER SCORE</text><circle class="packet" cx="90" cy="112" r="8" fill="#c084fc"/><rect class="pulse" x="675" y="155" width="255" height="65" rx="10" fill="#211735" stroke="#a78bfa"/><text x="700" y="194" fill="#cbd5e1" font-size="17">Coverage + utility</text><text x="28" y="280" fill="#8099b5" font-size="12">CONCEPTUAL WORKFLOW / fresh portfolio implementation</text></g></svg>